- url: https://app.turnkey.coach
components:
  schemas:
    error:
      type: object
      properties:
        error:
          type: string
        error_details:
          type: array
          items:
            type: string
      required:
      - error
    conversations:
      type: object
      properties:
        private_conversations:
          type: array
          items:
            "$ref": "#/components/schemas/conversation"
        active_channels:
          type: array
          items:
            "$ref": "#/components/schemas/conversation"
        archived_channels:
          type: array
          items:
            "$ref": "#/components/schemas/conversation"
    conversation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
          description: The name of the channel.
        private:
          type: boolean
        muted:
          type: boolean
          description: If true, user will not receive any notifcation of new messages.
        calendar_path:
          type: string
          nullable: true
          description: Calendar path to the Recipient's calendar. If the conversation
            is a channel, this will be nil.
        status:
          type: string
          enum:
          - active
          - archived
          description: 'One of: active|archived.'
        membership_type:
          type: string
          enum:
          - manual
          - auto_company
          - auto_coach_clients
          description: 'How users are added to the conversation. One of: manual|auto_company|auto_coach_clients.'
        broadcast:
          type: boolean
          description: 'DEPRECATED: Use posting_permissions instead. If true, only
            conversation admins can post messages, otherwise all users can post messages.'
          deprecated: true
        allow_muting:
          type: boolean
          description: If true, users can mute the channel to stop receiving notifications.
        allow_leaving:
          type: boolean
          description: If true, users can leave the channel.
        posting_permissions:
          type: string
          enum:
          - all_members
          - coaches
          - admins
          description: 'Who can post in the channel. One of: all_members|coaches|admins.'
        can_post:
          type: boolean
          description: If true, the current user can post in the channel.
        member_count:
          type: integer
          description: Number of users in the channel.
        is_channel:
          type: boolean
          description: Whether the conversation is a channel.
        is_admin:
          type: boolean
          description: Whether the user is an admin for the channel.
        display_name:
          type: string
          description: Channel name or members synopsis.
        unread_messages_count:
          type: number
          description: Number of unread messages in the conversation.
          nullable: true
        has_unread_messages:
          type: boolean
          description: Whether conversation has unread messages.
          nullable: true
        last_message_synopsis:
          type: object
          properties:
