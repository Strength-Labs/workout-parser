  "/api/v1/assigned_metrics/{id}":
    parameters:
    - name: id
      in: path
      description: Assigned Metric ID
      required: true
      schema:
        type: integer
    put:
      summary: Update assigned metric
      tags:
      - Assigned Metrics
      parameters: []
      responses:
        '200':
          description: Assigned metric updated successfully
          content:
            application/json:
              examples:
                Assigned metric updated successfully:
                  value:
                    id: 1
                    name: Test Metric 1
                    description: Test description
                    priority: 1
                    metric_type: scale
                    scale_range:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    date: '2023-01-01'
                    metric:
                      id: 8
                      name: Test Metric 1
                      description: A test metric for automated testing
                      metric_type: integer
                      scale_start:
                      scale_end:
                    metric_answer:
                      id: 1
                      assigned_metric_id: 1
                      value: 0
              schema:
                "$ref": "#/components/schemas/assigned_metric"
        '422':
          description: Assigned metric not found
          content:
            application/json:
              examples:
                Invalid parameters:
                  value:
                    error: assigned_metric not updated
                    error_details:
                    - Unsupported metric type invalid_type
                Assigned metric not found:
                  value:
                    error: assigned_metric not found
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  type: string
                  description: Answer value for the metric
                metric_type:
                  type: string
                  enum:
                  - integer
                  - decimal
                  - short_text
                  - long_text
                  - scale
                  description: Type of metric
            examples:
              Assigned metric updated successfully:
                summary: Assigned metric updated successfully
                value:
                  answer: Updated answer
                  metric_type: integer
              Invalid parameters:
                summary: Invalid parameters
                value:
                  answer: ''
                  metric_type: invalid_type
              Assigned metric not found:
                summary: Assigned metric not found
                value:
                  answer: Test
