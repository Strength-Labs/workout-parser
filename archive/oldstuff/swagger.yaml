  "/api/v1/storage":
    post:
      summary: Create Storage Blob
      tags:
      - Storage
      parameters: []
      responses:
        '200':
          description: A user can add a storage object
          content:
            application/json:
              examples:
                A user can add a storage object:
                  value:
                    url: "/example/avatar.jpg"
                    headers:
                      Content-Type: video/webm
                    signed_id: example_token_123456789
                    storage_object:
                      key: example_token_123456789
                      filename: test_video1.webm
                      content_type: video/webm
                      byte_size: 60000000
                      checksum: abc123
              schema:
                "$ref": "#/components/schemas/storage_upload"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  required: true
                  description: The name the stored file will have.
                md5_checksum:
                  type: string
                  required: true
                  description: ''
                file_size:
                  type: integer
                  required: true
                  description: Size of the file in bytes.
                content_type:
                  type: string
                  description: File content type.
                storage_type:
                  type: string
                  enum:
                  - default
                  - source_video
            examples:
              A user can add a storage object:
                summary: A user can add a storage object
                value:
                  storage_upload:
                    file_name: test_video1.webm
                    md5_checksum: abc123
                    file_size: 60000000
                    content_type: video/webm
              '':
                summary: ''
                value:
                  storage_upload:
                    file_size: 600000000
  "/api/v1/storage/{id}":
    parameters:
    - name: id
      in: path
      description: The signed ID of the storage object to delete
      required: true
      schema:
        type: string
    delete:
      summary: Delete Storage Blob
      tags:
      - Storage
      responses:
        '200':
          description: A user can delete a storage object
          content:
            application/json:
              examples:
                A user can delete a storage object:
                  value:
                    key: example_token_123456789
                    filename: test.webm
                    content_type: video/webm
                    byte_size: 5
                    checksum: qwerty123
              schema:
                "$ref": "#/components/schemas/storage_upload"
