---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/actual_sets":
    put:
      summary: Update Actual Sets
      tags:
      - Actual Sets
      parameters:
      - name: assigned_set_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Update tonnage on completed workout
          content:
            application/json:
              examples:
                Update actual sets on workout:
                  value:
                  - id: 1
                    assigned_set_id: 1
                    priority: 0
                    weight: 200.0
                    reps: 5
                    sets: 3
                    distance: 0.0
                    distance_unit:
                    time: 0
                  - id: 2
                    assigned_set_id: 1
                    priority: 1
                    weight: 210.0
                    reps: 6
                    sets: 4
                    distance: 0.0
                    distance_unit:
                    time: 2700
                Update actual sets for distance exercise:
                  value:
                  - id: 1
                    assigned_set_id: 2
                    priority: 0
                    weight:
                    reps:
                    sets:
                    distance: 26.2
                    distance_unit: miles
                    time: 16200
                Update tonnage on completed workout:
                  value:
                  - id: 1
                    assigned_set_id: 1
                    priority: 0
                    weight: 200.0
                    reps: 5
                    sets: 3
                    distance: 0.0
                    distance_unit:
                    time: 0
                  - id: 2
                    assigned_set_id: 1
                    priority: 1
                    weight: 210.0
                    reps: 6
                    sets: 4
                    distance: 0.0
                    distance_unit:
                    time: 2700
              schema:
                "$ref": "#/components/schemas/actual_sets"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  sets:
                    type: integer
                    description: Number of sets.
                  reps:
                    type: integer
                    description: Number of reps.
                  weight:
                    type: decimal
                    description: Weight lifted.
                  distance:
                    type: decimal
                    description: Distance covered.
                  distance_unit:
                    type: string
                    enum:
                    - miles
                    - kilometers
                    - meters
                    - yards
                    - feet
                    - calories
                  time:
                    type: object
                    properties:
                      hh:
                        type: integer
                        description: Hours for time.
                      mm:
                        type: integer
                        description: Minutes for time.
                      ss:
                        type: integer
                        description: Seconds for time.
            examples:
              Update actual sets on workout:
                summary: Update actual sets on workout
                value:
                  actual_sets:
                  - sets: 3
                    reps: 5
                    weight: 200
                  - sets: 4
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
              Update actual sets for distance exercise:
                summary: Update actual sets for distance exercise
                value:
                  actual_sets:
                  - distance: 26.2
                    distance_unit: miles
                    time:
                      hh: 4
                      mm: 30
                      ss: 0
              Update tonnage on completed workout:
                summary: Update tonnage on completed workout
                value:
                  actual_sets:
                  - sets: 3
                    reps: 5
                    weight: 200
                  - sets: 4
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
              Invalid params are handled correctly:
                summary: Invalid params are handled correctly
                value:
                  actual_sets:
                  - sets: 3
                    reps: 5
                    weight: 200
                    distance: 2
                    distance_unit: invalid
                    time:
                      hh: 0
                      mm: 30
                      ss: 0
                  - sets: 4
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
              Error in request results in full rollback:
                summary: Error in request results in full rollback
                value:
                  actual_sets:
                  - sets: 4
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
                  - sets: 3
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
                  - sets: 2
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
                  - sets: 3
                    reps: 5
                    weight: 200
                    distance: 2
                    distance_unit: invalid
                    time:
                      hh: 0
                      mm: 30
                      ss: 0
              Prevents adding sets for another user or client:
                summary: Prevents adding sets for another user or client
                value:
                  actual_sets:
                  - sets: 3
                    reps: 5
                    weight: 200
                    time:
                      hh: 0
                      mm: 30
                      ss: 0
                  - sets: 4
                    reps: 6
                    weight: 210
                    time:
                      hh: 0
                      mm: 45
                      ss: 0
  "/api/v1/assigned_exercises":
    post:
      summary: Create Assigned Exercise
      tags:
      - Assigned Exercises
      parameters: []
      responses:
        '200':
          description: Create assigned exercise
          content:
            application/json:
              examples:
                Create assigned exercise:
                  value:
                    id: 4
                    priority: 5
                    workout_id: 1
                    workout_template_id:
                    missed: false
                    exercise:
                      id: 1
                      name: Squat
                      video_url:
                      exercise_type: resistance
                    assigned_sets:
                    - id: 5
                      assigned_exercise_id: 4
                      priority: 0
                      weight: 200.0
                      weight_type: default_weight_type
                      reps: 5
                      rep_type: default_rep_type
                      sets: 3
                      set_type: default
                      distance: 0.0
                      distance_unit:
                      time: 1
                      body: body
                      video_id:
                      weight_type_value:
                      actual_sets: []
                      display_label: 3 x 5 @ 200 lbs
              schema:
                "$ref": "#/components/schemas/assigned_exercise"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workout_id:
                  type: integer
                  description: Workout ID
                exercise_id:
                  type: integer
                  description: Exercise ID
                priority:
                  type: integer
                  description: Priority
                assigned_sets:
                  type: array
                  items:
                    type: object
                    properties:
                      priority:
                        type: integer
                        description: Priority
                      weight:
                        type: number
                        description: Weight
                      weight_type:
                        type: string
                        description: Weight Type
                      reps:
                        type: integer
                        description: Reps
                      rep_type:
                        type: string
                        description: Rep Type
                      sets:
                        type: integer
                        description: Sets
                      set_type:
                        type: string
                        description: Set Type
                      distance:
                        type: number
                        description: Distance
                      distance_unit:
                        type: string
                        description: Distance Unit
                      time:
                        type: integer
                        description: Time
                      body:
                        type: string
                        description: Body
            examples:
              Create assigned exercise:
                summary: Create assigned exercise
                value:
                  workout_id: 1
                  exercise_id: 1
                  priority: 5
                  assigned_sets:
                  - priority: 0
                    weight: 200
                    weight_type: default_weight_type
                    reps: 5
                    rep_type: default_rep_type
                    sets: 3
                    set_type: default
                    distance: 0
                    distance_unit:
                    time: 1
                    body: body
