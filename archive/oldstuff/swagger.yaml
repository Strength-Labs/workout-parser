  "/api/v1/avatar":
    get:
      summary: Get Avatar
      tags:
      - Avatar
      responses:
        '200':
          description: Avatar found
          content:
            application/json:
              examples:
                Avatar found:
                  value:
                    id: 1
                    avatar_url: "/example/avatar.jpg"
              schema:
                "$ref": "#/components/schemas/avatar"
    post:
      summary: Create Avatar
      tags:
      - Avatar
      parameters: []
      responses:
        '200':
          description: Avatar created
          content:
            application/json:
              examples:
                Avatar created:
                  value:
                    id: 1
                    avatar_url: "/example/avatar.jpg"
              schema:
                "$ref": "#/components/schemas/avatar"
        '422':
          description: Avatar not created
          content:
            application/json:
              examples:
                Invalid avatar file:
                  value:
                    error: avatar not created
                    error_details:
                    - Invalid avatar file
                Avatar not created:
                  value:
                    error: avatar not created
                    error_details:
                    - Avatar already exists
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: file
              required:
              - avatar
        description: The file to upload
    put:
      summary: Update Avatar
      tags:
      - Avatar
      parameters: []
      responses:
        '200':
          description: Avatar updated
          content:
            application/json:
              examples:
                Avatar updated:
                  value:
                    id: 1
                    avatar_url: "/example/avatar.jpg"
              schema:
                "$ref": "#/components/schemas/avatar"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: file
              required:
              - avatar
        description: The file to upload
    delete:
      summary: Delete Avatar
      tags:
      - Avatar
      responses:
        '200':
          description: Avatar deleted
          content:
            application/json:
              examples:
                Avatar deleted:
                  value:
                    id: 1
                    avatar_url:
              schema:
                "$ref": "#/components/schemas/avatar"
        '422':
          description: Avatar not deleted
