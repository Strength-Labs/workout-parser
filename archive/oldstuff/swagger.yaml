  "/api/v1/blocked_dates":
    get:
      summary: Get Blocked Dates
      tags:
      - Blocked Dates
      parameters:
      - name: user_id
        in: query
        schema:
          type: integer
        required: false
        description: User ID whose blocked_dates are to be fetched. For non-coaches,
          this is ignored. For coaches, this is used if the user is an active client.
      - name: start_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: Fetch blocked_dates for on or after this date.
      - name: end_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: Fetch blocked_dates for on or before this date.
      responses:
        '200':
          description: Get blocked_dates created before date
          content:
            application/json:
              examples:
                Get Blocked Dates:
                  value:
                  - id: 1
                    reason: For reasons
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
                  - id: 2
                    reason: For reasons
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
                Get blocked_dates created before date:
                  value:
                  - id: 2
                    reason: For reasons
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
              schema:
                "$ref": "#/components/schemas/blocked_dates"
    post:
      summary: Create Blocked Date
      tags:
      - Blocked Dates
      parameters: []
      responses:
        '200':
          description: A coach can add a blocked_date
          content:
            application/json:
              examples:
                A user can add a blocked_date:
                  value:
                    id: 4
                    reason: Hey there!
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
                A coach can add a blocked_date:
                  value:
                    id: 4
                    reason: Hey there!
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
              schema:
                "$ref": "#/components/schemas/blocked_date"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: The user that the blocked_date is for. Defaults to
                    current user if not provided.
                date:
                  type: string
                  format: date
                  description: Blocked Date date.
                reason:
                  type: string
                  description: Blocked Date reason.
            examples:
              A user can add a blocked_date:
                summary: A user can add a blocked_date
                value:
                  reason: Hey there!
                  date: '2023-01-01'
              A coach can add a blocked_date:
                summary: A coach can add a blocked_date
                value:
                  user_id: 1
                  reason: Hey there!
                  date: '2023-01-01'
              A user cannot add a blocked_date for another user:
                summary: A user cannot add a blocked_date for another user
                value:
                  user_id: 1
                  reason: Hey there!
                  date: '2023-01-01'
  "/api/v1/blocked_dates/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: Update Blocked Date
      tags:
      - Blocked Dates
      parameters: []
      responses:
        '200':
          description: A coach can update their client's blocked_date
          content:
            application/json:
              examples:
                A client can update their own blocked_date:
                  value:
                    id: 1
                    reason: Updated blocked_date
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
                A coach can update their client's blocked_date:
                  value:
                    id: 1
                    reason: Updated blocked_date
                    date: '2023-01-01'
                    user:
                      id: 1
                      first_name: Perd
                      last_name: Hapley
                      avatar_url:
                      full_name: Perd Hapley
                    created_at: '2023-01-01T00:00:00.000Z'
              schema:
                "$ref": "#/components/schemas/blocked_date"
        '422':
          description: A client cannot delete another client's blocked_date
          content:
            application/json:
              examples:
                A client cannot delete another client's blocked_date:
                  value:
                    error: blocked date not updated
                    error_details:
