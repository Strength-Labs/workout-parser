  "/api/v1/me/payment_methods":
    get:
      summary: List Payment Methods
      tags:
      - Payment Methods
      security:
      - bearerAuthScheme: []
      responses:
        '200':
          description: No payment methods found
          content:
            application/json:
              examples:
                Payment methods retrieved successfully:
                  value:
                  - id: pm_test_123
                    brand: Visa
                    last4: '4242'
                    exp_month: 12
                    exp_year: 2025
                    is_default: true
                No payment methods found:
                  value: []
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    brand:
                      type: string
                    last4:
                      type: string
                    exp_month:
                      type: integer
                    exp_year:
                      type: integer
                    is_default:
                      type: boolean
                  required:
                  - id
                  - brand
                  - last4
                  - exp_month
                  - exp_year
                  - is_default
        '422':
          description: Stripe error occurred
          content:
            application/json:
              examples:
                Stripe error occurred:
                  value:
                    error: payment methods not found
                    error_details:
                    - Stripe connection failed
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add Payment Method
      tags:
      - Payment Methods
      security:
      - bearerAuthScheme: []
      parameters: []
      responses:
        '201':
          description: Payment method added successfully
          content:
            application/json:
              examples:
                Payment method added successfully:
                  value:
                    message: Payment method added successfully.
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '422':
          description: Missing payment method ID
          content:
            application/json:
              examples:
                Failed to add payment method:
                  value:
                    error: payment method not created
                    error_details:
                    - Failed to add payment method.
                Stripe error occurred:
                  value:
                    error: payment method not created
                    error_details:
                    - Stripe connection failed
                Missing payment method ID:
                  value:
                    error: payment method not created
                    error_details:
                    - no implicit conversion of nil into String
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method_id:
                  type: string
                  description: Stripe payment method ID
              required:
              - payment_method_id
            examples:
              Payment method added successfully:
                summary: Payment method added successfully
                value:
                  payment_method_id: pm_test_123
              Failed to add payment method:
                summary: Failed to add payment method
                value:
                  payment_method_id: pm_invalid
              Stripe error occurred:
                summary: Stripe error occurred
                value:
                  payment_method_id: pm_error
  "/api/v1/me/payment_methods/{id}":
    parameters:
    - name: id
      in: path
      description: Payment method ID
      required: true
      schema:
        type: string
    delete:
      summary: Remove Payment Method
      tags:
      - Payment Methods
      security:
      - bearerAuthScheme: []
      responses:
        '200':
          description: Payment method removed successfully
          content:
            application/json:
              examples:
                Payment method removed successfully:
                  value:
                    message: Payment method removed successfully.
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '422':
          description: Stripe error occurred during removal
          content:
            application/json:
              examples:
                Failed to remove payment method:
                  value:
                    error: payment method not deleted
                    error_details:
                    - Failed to remove payment method.
                Stripe error occurred during removal:
                  value:
                    error: payment method not deleted
                    error_details:
                    - Payment method not found
              schema:
                "$ref": "#/components/schemas/error"
