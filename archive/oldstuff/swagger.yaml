  "/api/v1/workouts":
    get:
      summary: Get Workouts
      tags:
      - Workouts
      parameters:
      - name: user_id
        in: query
        schema:
          type: integer
        required: false
        description: User ID whose workouts are to be fetched. For non-coaches, this
          is ignored. For coaches, this is required if created_by_id is not provided.
      - name: created_by_id
        in: query
        schema:
          type: integer
        required: false
        description: User ID who created the workouts that are to be fetched. For
          coaches, this is required if user_id is not provided.
      - name: start_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: Fetch workouts on or after this date.
      - name: end_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: Fetch workouts on or before this date.
      - name: completed
        in: query
        schema:
          type: boolean
        required: false
        description: Fetch only completed or uncompleted workouts.
      - name: published
        in: query
        schema:
          type: boolean
        required: false
        description: Fetch only published or unpublished (draft) workouts.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - ascending
          - descending
        required: false
        default: descending
        description: Sort workouts by workout date.
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: Limit the number of workouts to fetch.
      responses:
        '200':
          description: A client gets their own workouts
          content:
            application/json:
              examples:
                Get workouts:
                  value:
                  - id: 4
                    title:
                    workout_date: '2023-01-01'
                    completed: true
                    published: true
                    tonnage: 0.0
                    weight_type: lbs
                    last_activity: '2023-01-01T00:00:00.000Z'
                    last_reviewed_at:
